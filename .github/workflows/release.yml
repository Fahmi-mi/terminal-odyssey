name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Multi-Platform Binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"

          echo "Compiling Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/odyssey-linux-amd64 ./cmd/odyssey

          echo "Compiling Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/odyssey-linux-arm64 ./cmd/odyssey

          echo "Compiling Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/odyssey-windows-amd64.exe ./cmd/odyssey

          echo "Compiling macOS amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/odyssey-darwin-amd64 ./cmd/odyssey

          echo "Compiling macOS arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/odyssey-darwin-arm64 ./cmd/odyssey

          echo "Generating SHA256 Checksums..."
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/odyssey-linux-amd64
            dist/odyssey-linux-arm64
            dist/odyssey-windows-amd64.exe
            dist/odyssey-darwin-amd64
            dist/odyssey-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
