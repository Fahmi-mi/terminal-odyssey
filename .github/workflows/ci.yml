name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'dev'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Static Code Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...

      - name: Verify Application Build
        run: go build -v -ldflags="-s -w" -o /dev/null ./cmd/odyssey
